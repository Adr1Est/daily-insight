<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Dibujado sobre una cuadrícula de 16 × 16 (cada celda, 2 unidades) para que sea nítido a 16 px. -->
